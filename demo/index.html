<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora · OPS 360°</title>
<style>
  :root {
    --fundo: #e9eef5;
    --painel: #0b1222;
    --painel-2: #080e1b;
    --borda: #1a2842;
    --texto: #e6edf7;
    --suave: #8ea0bd;
    --destaque: #2dd4bf;
    --destaque-2: #22d3ee;
    --bolha: #0f1a2d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fundo: #050912; }
  }
  :root[data-theme="dark"] { --fundo: #050912; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--fundo); color: var(--texto);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app {
    width: min(780px, 100%); height: min(880px, calc(100vh - 32px)); min-height: 520px;
    background: var(--painel); border: 1px solid #16223a; border-radius: 22px;
    box-shadow: 0 30px 80px rgba(2, 8, 23, .45); display: flex; flex-direction: column; overflow: hidden;
  }
  .topo { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--borda); flex-wrap: wrap; }
  .marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .marca-logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #0f766e, #155e75); flex-shrink: 0; }
  .marca-nome { font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
  .marca-nome small { display: block; font-weight: 500; font-size: 11.5px; color: var(--suave); letter-spacing: 0; }
  .ia-titulo { display: flex; flex-direction: column; line-height: 1.2; }
  .ia-titulo strong { font-size: 14px; }
  .ia-titulo span { font-size: 12px; color: var(--suave); }
  .ferramentas { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .ferramentas button {
    background: transparent; color: var(--suave); border: 1px solid var(--borda); border-radius: 999px;
    padding: 6px 11px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .ferramentas button:hover, .ferramentas button[aria-pressed="true"] { color: var(--texto); border-color: rgba(45, 212, 191, .6); }
  .mensagens {
    flex: 1; overflow-y: auto; margin: 14px 14px 0; padding: 18px; border-radius: 16px;
    background: var(--painel-2); display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth;
  }
  .message { display: flex; gap: 12px; align-items: flex-start; max-width: 92%; }
  .message.user { align-self: flex-end; }
  .message-avatar {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
    background: #0e1b2e; border: 2px solid rgba(45, 212, 191, .55); box-shadow: 0 0 12px rgba(45, 212, 191, .25);
  }
  .bubble {
    background: var(--bolha); border: 1px solid #1b2a45; border-left: 3px solid var(--destaque);
    padding: 11px 14px; border-radius: 12px; line-height: 1.55; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .message.user .bubble { background: linear-gradient(135deg, #0f766e, #0e7490); border: 0; color: #fff; }
  .compreensao { display: none; margin-top: 6px; font-size: 11.5px; color: var(--suave); }
  .ver-compreensao .compreensao { display: block; }
  .dots { letter-spacing: 3px; color: var(--suave); }
  .sugestoes { display: flex; gap: 8px; padding: 12px 16px 4px; overflow-x: auto; scrollbar-width: none; }
  .sugestoes::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; background: #0e1829; color: #b7c6dd; border: 1px solid var(--borda); border-radius: 999px;
    padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { border-color: rgba(45, 212, 191, .6); color: var(--texto); }
  .entrada { padding: 10px 14px 16px; }
  .caixa {
    display: flex; align-items: flex-end; gap: 10px; background: #0a1322; border: 1.5px solid rgba(45, 212, 191, .7);
    border-radius: 20px; padding: 10px 10px 10px 16px;
    box-shadow: 0 0 18px rgba(45, 212, 191, .22), inset 0 0 12px rgba(45, 212, 191, .06);
  }
  textarea {
    flex: 1; background: transparent; border: 0; color: var(--texto); resize: none; outline: none;
    font: inherit; font-size: 15px; line-height: 1.45; max-height: 120px; padding: 6px 0;
  }
  textarea::placeholder { color: #7486a4; }
  .enviar {
    width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--destaque), var(--destaque-2)); color: #04221f; flex-shrink: 0;
  }
  .rodape { text-align: center; font-size: 11.5px; color: #64748b; padding: 0 16px 12px; }
  @media (max-width: 560px) {
    body { padding: 0; }
    .app { height: 100vh; border-radius: 0; border: 0; }
    .mensagens { margin: 8px 8px 0; padding: 12px; }
    .message { max-width: 100%; }
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <header class="topo">
      <div class="marca">
        <div class="marca-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#e6fffb" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
        </div>
        <div class="marca-nome">OPS 360°<small>Safety First · V49.202.0</small></div>
      </div>
      <!-- Como na V49.201.0: este texto é removido automaticamente pela integração. -->
      <div class="ia-titulo"><strong>Aurora</strong><span>sua assistente de inteligência artificial</span></div>
      <div class="ferramentas">
        <button type="button" id="btnCompreensao" aria-pressed="false">Ver compreensão</button>
        <button type="button" id="btnNova">Nova conversa</button>
        <button type="button" id="btnEsquecer">Esquecer aprendizado</button>
      </div>
    </header>

    <main class="mensagens" id="chatMessages" aria-live="polite"></main>

    <div class="sugestoes" id="sugestoes" aria-label="Exemplos para testar"></div>

    <div class="entrada">
      <div class="caixa">
        <textarea id="chatInput" rows="1" placeholder="Pergunte ou digite um comando…" aria-label="Mensagem para a Aurora"></textarea>
        <button class="enviar" id="sendButton" type="button" aria-label="Enviar mensagem">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
    <div class="rodape">Demonstração com base de conhecimento de exemplo — no OPS 360° a Aurora usa a sua base.</div>
  </div>

  <!-- AURORA:INICIO -->
  <script>window.AURORA_CONFIG = { depurar: false };</script>
  <script src="../exemplos/base-conhecimento-exemplo.js"></script>
  <script>window.AURORA_CONFIG.base = window.AURORA_BASE_EXEMPLO;</script>
  <script src="../src/aurora-compreensao.js"></script>
  <script src="../src/aurora-avatar.js"></script>
  <script src="../src/aurora-integracao.js"></script>
  <!-- AURORA:FIM -->

  <script>
    // ------------------------------------------------------------------
    // Simulação do app como ele é hoje (V49.201.0): motor por palavra-chave
    // que responde "Desculpe, não entendi" e o logo antigo nas mensagens.
    // Nada aqui foi adaptado para a Aurora — a integração cuida de tudo.
    // ------------------------------------------------------------------
    const LOGO_ANTIGO = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/><circle cx="12" cy="12" r="1.7" fill="#2dd4bf" stroke="none"/></svg>';
    const caixa = document.getElementById('chatMessages');
    const campo = document.getElementById('chatInput');

    function gerarResposta(texto) {
      const t = texto.toLowerCase();
      let melhor = null;
      let pontos = 0;
      (window.AURORA_BASE_EXEMPLO || []).forEach((item) => {
        const p = item.palavras.filter((k) => t.includes(k.toLowerCase())).length;
        if (p > pontos) { pontos = p; melhor = item; }
      });
      return melhor ? melhor.resposta : 'Desculpe, não entendi sua pergunta. Pode reformular?';
    }

    function rolar() { caixa.scrollTop = caixa.scrollHeight; }

    function mensagemUsuario(texto) {
      const el = document.createElement('div');
      el.className = 'message user';
      el.innerHTML = '<div class="bubble"></div>';
      el.querySelector('.bubble').textContent = texto;
      caixa.appendChild(el);
      rolar();
    }

    function mensagemIA(conteudo, digitando) {
      const el = document.createElement('div');
      el.className = 'message ai' + (digitando ? ' typing' : '');
      el.innerHTML = '<div class="message-avatar">' + LOGO_ANTIGO + '</div><div><div class="bubble"></div><div class="compreensao"></div></div>';
      const bolha = el.querySelector('.bubble');
      caixa.appendChild(el);
      if (digitando) {
        bolha.innerHTML = '<span class="dots">...</span>';
      } else {
        digitar(bolha, conteudo);
      }
      rolar();
      return el;
    }

    // Efeito de digitação (como no app): o avatar fala conforme o texto aparece.
    function digitar(bolha, texto, pronto) {
      let i = 0;
      const passo = () => {
        i = Math.min(texto.length, i + 2);
        bolha.textContent = texto.slice(0, i);
        rolar();
        if (i < texto.length) setTimeout(passo, 26);
        else if (pronto) pronto();
      };
      passo();
    }

    function enviar(textoOpcional) {
      const texto = (textoOpcional || campo.value).trim();
      if (!texto) return;
      mensagemUsuario(texto);
      campo.value = '';
      campo.style.height = '';
      const indicador = mensagemIA('', true);
      setTimeout(async () => {
        const resposta = await gerarResposta(texto);
        const r = window.Aurora && window.Aurora.ultimoResultado;
        indicador.remove();
        const el = mensagemIA('', false);
        if (r && r.resumo) el.querySelector('.compreensao').textContent = 'Entendi: ' + r.resumo;
        digitar(el.querySelector('.bubble'), resposta);
      }, 600 + Math.random() * 500);
    }

    document.getElementById('sendButton').addEventListener('click', () => enviar());
    campo.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); enviar(); }
    });
    campo.addEventListener('input', () => {
      campo.style.height = 'auto';
      campo.style.height = Math.min(120, campo.scrollHeight) + 'px';
    });

    const EXEMPLOS = [
      'eae aurora blz?', 'qual a validade do treinamento de nr35?', 'e da nr10?', 'e quantas horas tem?',
      'Gostaria de saber quem deve elaborar a APR.', 'não entendi', 'me dá um exemplo', 'o que é pt',
      'não é isso', 'posso jogar agua em incendio eletrico?', 'qual o prazo pra abrir cat', 'obrigada!',
      'meu colega levou choque!', 'conta uma piada'
    ];
    const barra = document.getElementById('sugestoes');
    EXEMPLOS.forEach((ex) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = ex;
      b.addEventListener('click', () => enviar(ex));
      barra.appendChild(b);
    });

    const btnC = document.getElementById('btnCompreensao');
    btnC.addEventListener('click', () => {
      const ligado = document.getElementById('app').classList.toggle('ver-compreensao');
      btnC.setAttribute('aria-pressed', String(ligado));
    });
    document.getElementById('btnNova').addEventListener('click', () => {
      if (window.Aurora && window.Aurora.nlu) window.Aurora.nlu.reiniciarConversa();
      caixa.innerHTML = '';
      mensagemIA('Nova conversa! 😊 Pode perguntar do seu jeito — formal, informal ou técnico.', false);
    });
    document.getElementById('btnEsquecer').addEventListener('click', () => {
      if (window.Aurora) window.Aurora.esquecer();
      mensagemIA('Pronto, apaguei o que eu tinha aprendido sobre você neste navegador.', false);
    });

    mensagemIA('Oi! 😊 Pode perguntar do seu jeito — formal, informal ou técnico. Eu entendo gírias, abreviações e erros de digitação.', false);
  </script>
</body>
</html>
